<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="560" viewBox="0 0 1290 560" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, WenQuanYi Zen Hei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1290" height="560" fill="#fff"/>
<text x="20" y="32" font-size="18" font-weight="bold">System Context Diagram · DW Control SW</text>
<line x1="330" y1="129.0" x2="560" y2="149.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="445.0" y="112.0" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">System Operations</text>
<text x="445.0" y="129.0" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">changeMode(), startSetting(), …</text>
<line x1="560" y1="209.0" x2="330" y2="191.4" stroke="#333" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a)"/>
<text x="445.0" y="222.2" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">현재 상태 조회</text>
<text x="445.0" y="239.2" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">(모드 · 설정 중 · 경보 중 · 타이머 동작)</text>
<line x1="330" y1="390.0" x2="560" y2="356.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="445.0" y="395.0" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">tick()</text>
<text x="445.0" y="412.0" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">(1초 인터럽트)</text>
<line x1="760" y1="191.0" x2="1000" y2="180.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="880.0" y="158.5" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">화면 표시 · 깜빡임</text>
<text x="880.0" y="175.5" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">백라이트 on/off</text>
<line x1="760" y1="311.0" x2="1000" y2="350.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="880.0" y="352.5" text-anchor="middle" font-size="13" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">경보음 on/off</text>
<rect x="40" y="90" width="290" height="130" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="185.0" y="138.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="185.0" y="160.0" text-anchor="middle" font-size="15" font-weight="bold">ButtonHandler</text>
<text x="185.0" y="182.0" text-anchor="middle" font-size="13" font-weight="normal">MODE · SET · ADJUST · LIGHT 버튼 해석</text>
<rect x="40" y="340" width="290" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="185.0" y="373.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="185.0" y="395.0" text-anchor="middle" font-size="15" font-weight="bold">Time Source</text>
<text x="185.0" y="417.0" text-anchor="middle" font-size="13" font-weight="normal">HW Timer (SW controller 내장)</text>
<rect x="560" y="110" width="200" height="300" rx="4" fill="#fff8d6" stroke="#7a5c00" stroke-width="1.6"/>
<text x="660.0" y="265.0" text-anchor="middle" font-size="18" font-weight="bold">DW Control SW</text>
<rect x="1000" y="130" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="1125.0" y="163.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="1125.0" y="185.0" text-anchor="middle" font-size="15" font-weight="bold">LCD</text>
<text x="1125.0" y="207.0" text-anchor="middle" font-size="13" font-weight="normal">(+ Backlight)</text>
<rect x="1000" y="300" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="1125.0" y="344.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="1125.0" y="366.0" text-anchor="middle" font-size="15" font-weight="bold">Buzzer</text>
<text x="20" y="518" font-size="12" fill="#666">시스템 경계 = DW Control SW. 외부 요소는 «device»로 표기한다. ButtonHandler는 경계 밖 외부 요소로 본다: 물리 버튼 4개의 press/release를 해석해 System Operation을 보낸다.</text>
<text x="20" y="538" font-size="12" fill="#666">SW controller에 내장된 HW Timer도 SW 입장에서는 외부 장치로 본다.</text>
</svg>