<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="430" viewBox="0 0 1270 430" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, WenQuanYi Zen Hei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1270" height="430" fill="#fff"/>
<text x="20" y="32" font-size="18" font-weight="bold">System Context Diagram · DW Control SW</text>
<line x1="290" y1="120.0" x2="520" y2="195" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="405.0" y="130.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">누름 / 뗌</text>
<text x="405.0" y="147.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">(press / release)</text>
<line x1="290" y1="310.0" x2="520" y2="235" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="405.0" y="294.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">tick</text>
<text x="405.0" y="311.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">(0.5초 인터럽트)</text>
<line x1="720" y1="195" x2="980" y2="120.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="850.0" y="130.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">화면 표시 · 깜빡임</text>
<text x="850.0" y="147.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">백라이트 on/off</text>
<line x1="720" y1="235" x2="980" y2="310.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="850.0" y="294.5" text-anchor="middle" font-size="14" fill="#1a4f9c" stroke="#fff" stroke-width="4" paint-order="stroke">경보음 on/off</text>
<rect x="40" y="70" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="165.0" y="103.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="165.0" y="125.0" text-anchor="middle" font-size="15" font-weight="bold">Buttons ×4</text>
<text x="165.0" y="147.0" text-anchor="middle" font-size="13" font-weight="normal">MODE · SET · ADJUST · LIGHT</text>
<rect x="40" y="260" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="165.0" y="293.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="165.0" y="315.0" text-anchor="middle" font-size="15" font-weight="bold">Time Source</text>
<text x="165.0" y="337.0" text-anchor="middle" font-size="13" font-weight="normal">HW Timer (SW controller 내장)</text>
<rect x="520" y="160" width="200" height="110" rx="4" fill="#fff8d6" stroke="#7a5c00" stroke-width="1.6"/>
<text x="620.0" y="220.0" text-anchor="middle" font-size="18" font-weight="bold">DW Control SW</text>
<rect x="980" y="70" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="1105.0" y="103.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="1105.0" y="125.0" text-anchor="middle" font-size="15" font-weight="bold">LCD</text>
<text x="1105.0" y="147.0" text-anchor="middle" font-size="13" font-weight="normal">(+ Backlight)</text>
<rect x="980" y="260" width="250" height="100" rx="4" fill="#eef2fa" stroke="#3b5b92" stroke-width="1.6"/>
<text x="1105.0" y="304.0" text-anchor="middle" font-size="13" font-weight="normal">«device»</text>
<text x="1105.0" y="326.0" text-anchor="middle" font-size="15" font-weight="bold">Buzzer</text>
<text x="20" y="412" font-size="12" fill="#666">시스템 경계 = DW Control SW. SW controller에 내장된 HW Timer도 SW 입장에서는 외부 장치로 본다.</text>
</svg>